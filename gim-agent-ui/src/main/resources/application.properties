spring.main.banner-mode=off
# 全局懒加载：singleton 延迟到首次使用（主窗 start()/FXML 装配）才创建，缩短冷启动。
# 需启动期副作用/事件订阅的 bean 已显式 @Lazy(false)：TrayNotifier、SystemNotifier、WebDavSyncService。
spring.main.lazy-initialization=true
spring.quartz.job-store-type=memory
logging.level.root=INFO
# 更新服务器（gim-server-ai）生产基地址：客户端未手动配置时的内置默认，结尾勿带斜杠。
# 占位地址，正式发布前请替换为真实域名（不含 /ai/update/check 路径部分）。
update.server.base-url=https://api.gettyio.com
